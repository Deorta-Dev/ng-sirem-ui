name: Deploy demo

# Publica el catálogo demo (projects/demo) en GitHub Pages.
# URL del sitio: https://deorta-dev.github.io/ng-sirem-ui/
#
# Requisito (una sola vez): activar Pages en
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# (en repos de organización el GITHUB_TOKEN no puede crear el sitio por sí solo).
#
# Si algún día usas un dominio propio o un "user site"
# (deorta-dev.github.io sin subcarpeta), cambia BASE_HREF a "/".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_HREF: /ng-sirem-ui/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build del demo
        run: npm run build:demo -- --base-href="$BASE_HREF"

      # Fallback SPA: Pages sirve 404.html en rutas profundas
      # (/demo/sticky) para que Angular resuelva el router.
      - name: Preparar artefacto (404 + .nojekyll)
        run: |
          cp dist/demo/browser/index.html dist/demo/browser/404.html
          touch dist/demo/browser/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
